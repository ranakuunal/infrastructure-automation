name: Container Build CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "App/**"
      - ".github/workflows/container.yml"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish, e.g. tasky-v2"
        required: true
        type: string

      push_to_ecr:
        description: "Push validated image to ECR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wiz-exercise-tasky

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Container Image
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'tasky-ci-validation' }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            ./App

      - name: Verify wizexercise.txt
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'tasky-ci-validation' }}
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint sh \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            -c 'test -s /app/wizexercise.txt && cat /app/wizexercise.txt'

      - name: Configure AWS credentials
        if: github.event_name == 'workflow_dispatch' && inputs.push_to_ecr == true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          role-session-name: github-actions-tasky-container
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'workflow_dispatch' && inputs.push_to_ecr == true
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Image for ECR
        if: github.event_name == 'workflow_dispatch' && inputs.push_to_ecr == true
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Push Image to ECR
        if: github.event_name == 'workflow_dispatch' && inputs.push_to_ecr == true
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Verify Image in ECR
        if: github.event_name == 'workflow_dispatch' && inputs.push_to_ecr == true
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "Published image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"